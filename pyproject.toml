[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "linger-captions"
dynamic = ["version"]
description = "Keep every line from Windows 11 Live Captions until you stop — copy, save and export full transcripts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hassaan Khalid" }]
keywords = ["live captions", "transcript", "accessibility", "windows 11", "subtitles", "speech to text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "PySide6-Essentials>=6.5",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6.3", "Pillow>=10"]

[project.gui-scripts]
linger = "linger.app:main"

[project.urls]
Homepage = "https://github.com/hassaankhalid225/linger-captions"
Issues = "https://github.com/hassaankhalid225/linger-captions/issues"

[tool.hatch.version]
path = "src/linger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/linger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM112", "SIM905", "B008"]
